<!-- ✅ AI PANEL COMPONENT -->

<div id="dashboard-ai-panel" class="dashboard-side">
  <div class="ai-search-panel" id="ai-search-panel">
    <!-- ✅ Header -->

    <div class="ai-panel-header">
      <div>
        <div class="ai-panel-title">AI Assistant</div>

        <div class="ai-panel-sub">App help, navigation, and inbox insights</div>
      </div>

      <button
        class="ai-header-btn"
        id="ai-clear-btn"
        type="button"
        onclick="clearAiConversation()"
        title="Clear conversation"
        aria-label="Clear conversation"
      >
        Clear
      </button>
    </div>

    <!-- ✅ Input Box -->

    <div class="ai-search-box">
      <input
        type="text"
        class="ai-search-input"
        id="ai-input"
        name="ai_query"
        placeholder="Message AI Assistant..."
        autocomplete="new-password"
        spellcheck="true"
        onkeydown="handleAiKey(event)"
      />

      <button
        class="ai-header-btn"
        id="ai-ask-btn"
        type="button"
        onclick="askAiWithVoice()"
        title="Ask with voice"
        aria-label="Ask with voice"
      >
        🎤 Ask
      </button>

      <button
        class="ai-send-btn"
        id="ai-send-btn"
        type="button"
        onclick="sendAiQuery()"
        title="Send message"
        aria-label="Send message"
      >
        ↑
      </button>
    </div>

    <!-- ✅ Quick Suggestions -->

    <div class="ai-chips">
      <button
        class="ai-chip"
        type="button"
        onclick="prefillAi('How do I connect Gmail?')"
      >
        How do I connect Gmail?
      </button>

      <button class="ai-chip" type="button" onclick="prefillAi('Open compose')">
        Open compose
      </button>

      <button class="ai-chip" type="button" onclick="prefillAi('Show unread')">
        Show unread
      </button>

      <button
        class="ai-chip"
        type="button"
        onclick="prefillAi('Summarize today')"
      >
        Summarize today
      </button>
    </div>

    <!-- ✅ Results Area -->

    <div
      class="ai-results-area"
      id="ai-results"
      role="log"
      aria-live="polite"
      aria-busy="false"
    >
      <div class="ai-placeholder">Ask about the app or your inbox.</div>

      <div class="ai-empty" id="ai-empty">
        <div class="ai-empty-icon">AI</div>

        <div class="ai-empty-text">
          Get app guidance,<br />

          navigation help, summaries,<br />

          filters, and draft support.
        </div>
      </div>
    </div>
  </div>
</div>
